name: Tests

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Sync dependencies (dev extra)
        run: uv sync --extra dev

      - name: Unit and integration tests
        run: uv run pytest -q

      - name: Retrieval ablation harness
        # Fails loudly if the eval set stops being reproducible; the numbers
        # themselves are reviewed in docs/evaluation.md, not asserted here.
        run: uv run python scripts/eval_retrieval.py --json-only

  cross-platform:
    # The suite is documented as Linux-only until this job existed; Phase F
    # fixed the Windows encoding bugs, so keep the guard rail in place.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev
      - run: uv run pytest -q
